services:
  postgres:
    # Prefer alpine when available; 15-3.4 is commonly cached locally.
    image: ${POSTGIS_IMAGE:-postgis/postgis:15-3.4}
    container_name: habesha_freight_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: habesha_freight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d habesha_freight"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - habesha_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: habesha_freight_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: habesha_freight
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: ${JWT_SECRET:-supersecret_habesha_freight_jwt_key_2026}
      # Show OTP in API + logs when SMTP isn't configured
      DEMO_OTP: ${DEMO_OTP:-true}
      # auto = seed only when users table is empty; true/false to force
      SEED_ON_START: ${SEED_ON_START:-auto}
    ports:
      - "5001:5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - habesha_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: habesha_freight_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - habesha_net

volumes:
  pgdata:
  backend_uploads:

networks:
  habesha_net:
    driver: bridge
